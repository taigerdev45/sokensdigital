name: CI

# Le dépôt avait 391 tests et rien pour les exécuter : les régressions se
# découvraient en production (cf. docs/ANALYSE_COMPLETUDE_ET_ROADMAP_2026-08.md).
# Ce workflow ferme ce trou — il tourne sur chaque push et chaque PR.
on:
  push:
    branches: [main, taiger_technique]
  pull_request:

concurrency:
  # Une nouvelle push annule le run précédent de la même branche : inutile
  # de payer deux fois la CI pour un commit déjà remplacé.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Même moteur qu'en production (Supabase Postgres) plutôt que le
        # SQLite du fallback local : les différences de comportement entre
        # les deux (contraintes, types, transactions) sont exactement ce
        # qu'une CI doit attraper.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sokens_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      DATABASE_URL: postgres://postgres:ci@localhost:5432/sokens_ci
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Dépendances système de WeasyPrint. Sans elles, l'import lève une
      # OSError que le code rattrape en désactivant la génération PDF — les
      # tests passeraient donc en silence sur un chemin dégradé, sans jamais
      # exercer le rendu réel des factures et reçus.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev libcairo2

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      # Attrape le cas classique : un champ modifié sur un modèle sans la
      # migration correspondante. Passe en local, casse au déploiement.
      - name: Missing migrations check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Lue depuis frontend/.nvmrc plutot qu'ecrite ici : la version de
          # Node devient une donnee du depot, partagee par la CI et les
          # postes de dev, au lieu d'une constante dupliquee qui derive.
          #
          # Node 20 echouait a l'installation : @napi-rs/lzma-linux-x64-gnu
          # exige ^22.20 || ^24.12 || >=25. Le paquet est specifique a
          # linux-x64, donc npm l'ignore sous Windows et l'installe sur le
          # runner — la panne n'apparaissait qu'en CI. Node 20 est de toute
          # facon en fin de support depuis avril 2026.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # La sortie est remontee en annotation d'echec : les logs bruts d'un
        # job demandent les droits admin sur le depot, alors que les
        # annotations sont lisibles par tous. Sans ca, un npm ci casse ne
        # laisse voir que « exit code 1 ».
        run: |
          set -o pipefail
          if ! npm ci 2>&1 | tee /tmp/npm-ci.log; then
            echo "::error::npm ci a echoue : $(head -n 12 /tmp/npm-ci.log | tr -s '[:space:]' ' ')"
            exit 1
          fi

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        # Valeurs factices : le build a besoin que les NEXT_PUBLIC_* soient
        # définies pour ne pas échouer au prerender, mais la CI ne se
        # connecte à aucun Firebase réel.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
